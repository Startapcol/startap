<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Star Tap - Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: sans-serif; max-width: 400px; margin: 40px auto; padding: 0 20px; }
  input { display: block; width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
  button { padding: 10px 20px; background: #ff5722; color: white; border: none; cursor: pointer; }
  .stat { font-size: 32px; font-weight: bold; }
  .card { border: 1px solid #ddd; padding: 16px; margin: 10px 0; border-radius: 8px; }
  #dashboard { display: none; }
</style>
</head>
<body>

<div id="login">
  <h2>Star Tap - Ingresa</h2>
  <input id="email" type="email" placeholder="Correo">
  <input id="password" type="password" placeholder="Contraseña">
  <button onclick="login()">Entrar</button>
  <p id="error" style="color:red;"></p>
</div>

<div id="dashboard">
  <h2 id="nombreNegocio"></h2>
  <div class="card">Total de taps<div class="stat" id="total">-</div></div>
  <div class="card">Hoy<div class="stat" id="hoy">-</div></div>
  <div class="card">Esta semana<div class="stat" id="semana">-</div></div>
  <div class="card">Este mes<div class="stat" id="mes">-</div></div>
</div>

<script>
const supabase = window.supabase.createClient(
  'https://deohhvjfsmahxfrytlyf.supabase.co',
  'sb_publishable_r2DKB83GDCH8puWYhDCPcA_uAzpSQqK'
);

async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) {
    document.getElementById('error').textContent = 'Correo o contraseña incorrectos';
    return;
  }
  cargarDatos();
}

async function cargarDatos() {
  const { data: negocio, error } = await supabase.from('negocios').select('*').single();
  if (!negocio) {
    document.getElementById('error').textContent = 'No se encontró un negocio conectado a este usuario. Error: ' + (error ? error.message : 'desconocido');
    return;
  }
  
  document.getElementById('login').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('nombreNegocio').textContent = negocio.nombre;

  const { data: taps } = await supabase.from('taps').select('creado_en').eq('negocio_id', negocio.id);

</script>
</body>
</html>
